name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  # A tag publishes nothing unless its version is the one the repo states and
  # CHANGELOG.md has notes for it (scripts/release_notes.py, RELEASING.md).
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tag matches pyproject, app, OpenAPI lock and CHANGELOG
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" --check

  # Two images, both multi-arch, tagged vX.Y.Z and latest. docker-compose.yml
  # pulls them by these names, so a rename here is a rename there.
  #   api: the Python image the api, migrate, worker, agents and
  #        homeassistant-mqtt services run. It keeps the name 1.1.0 was
  #        published under, so that package's `latest` stays truthful.
  #   web: the Observatory web app (apps/web).
  release-image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (Sigstore OIDC)
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            image: healthsave-observatory
            context: .
          - name: web
            image: healthsave-observatory-web
            context: ./apps/web
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - uses: sigstore/cosign-installer@v3

      # Keyless: the signature names this workflow run, no key to keep. Check
      # with: cosign verify <image>:<tag> \
      #   --certificate-identity-regexp '^https://github.com/<owner>/<repo>/' \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the image (cosign keyless)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          images=()
          for tag in ${TAGS}; do
            images+=("${tag}@${DIGEST}")
          done
          cosign sign --yes "${images[@]}"

  github-release:
    needs: [verify, release-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Release notes from CHANGELOG.md
        run: |
          python scripts/release_notes.py "$GITHUB_REF_NAME" \
            --link-base "https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/" \
            > release-notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "HealthSave Observatory $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
