[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "healthsave-mcp"
# Same version as the Observatory release it ships in
# (tests/contract/test_release_version_coherence.py).
version = "1.3.0"
description = "Read-only MCP server: your own AI client reads your HealthSave Observatory."
requires-python = ">=3.10"
license = { text = "Elastic-2.0" }
dependencies = [
  "mcp>=1.12,<2",
  "httpx>=0.27",
  "tzdata; sys_platform == 'win32'",
]

[project.scripts]
healthsave-mcp = "healthsave_mcp.__main__:main"

[project.urls]
Documentation = "https://github.com/umutkeltek/healthsave-observatory/blob/main/docs/mcp.md"
Source = "https://github.com/umutkeltek/healthsave-observatory/tree/main/packages/mcp"

[tool.setuptools.packages.find]
include = ["healthsave_mcp*"]
