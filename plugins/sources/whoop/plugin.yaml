id: whoop-healthsave
name: Whoop (HealthSave bridge)
kind: source
version: "0.1.0"
sdk_version: ">=0.1,<0.2"
language: python
entrypoint: "plugins.sources.whoop:WhoopSource"
emits:
  - workout.session
  - measurement.heart_rate
  - measurement.hrv
  - measurement.sleep_analysis
  - measurement.workouts
  - measurement.recovery
  - measurement.strain
  - measurement.body_measurement
permissions:
  network: true
  secrets:
    - WHOOP_CLIENT_ID
    - WHOOP_CLIENT_SECRET
    - WHOOP_REDIRECT_URI
    - HDH_TOKEN_ENC_KEY
  capabilities:
    - name: "write:oauth_tokens"
      description: "Persist and refresh the per-owner Whoop OAuth access/refresh token pair."
    - name: "write:measurements"
      description: "Insert recovery, sleep, workout, and HRV samples into the per-metric Timescale tables."
    - name: "network:api.prod.whoop.com"
      description: "Outbound HTTPS to Whoop's developer API for OAuth + data fetch."
source_capabilities:
  - plugin_id: whoop-healthsave
    metrics:
      - measurement.heart_rate
      - measurement.hrv
      - measurement.body_measurement
    delivery: polling
    record_shape: sample
    aggregation_scope: interval_component
    credential_ownership: owner
    identity_priority:
      - provider_subject_id
      - provider_object_id
      - device_identity_link
      - time_interval
  - plugin_id: whoop-healthsave
    metrics:
      - workout.session
      - measurement.sleep_analysis
      - measurement.workouts
    delivery: polling
    record_shape: session
    aggregation_scope: interval_component
    credential_ownership: owner
    identity_priority:
      - provider_subject_id
      - provider_object_id
      - device_identity_link
      - time_interval
  - plugin_id: whoop-healthsave
    metrics:
      - measurement.recovery
      - measurement.strain
    delivery: polling
    record_shape: daily_total
    aggregation_scope: provider_account_day_total
    credential_ownership: owner
    identity_priority:
      - provider_subject_id
      - provider_object_id
      - time_interval
