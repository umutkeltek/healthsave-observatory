id: google-health-api
name: Google Health API
kind: source
version: "0.1.0"
sdk_version: ">=0.1,<0.2"
language: python
entrypoint: "plugins.sources.google_health:GoogleHealthSource"
emits:
  - measurement.step_count
permissions:
  network: true
  secrets:
    - GOOGLE_HEALTH_CLIENT_ID
    - GOOGLE_HEALTH_CLIENT_SECRET
    - GOOGLE_HEALTH_REDIRECT_URI
    - HDH_TOKEN_ENC_KEY
  capabilities:
    - name: "write:oauth_tokens"
      description: "Persist and refresh per-owner Google Health OAuth tokens."
    - name: "write:measurements"
      description: "Insert Google Health steps through the existing IngestStorage port."
    - name: "network:health.googleapis.com"
      description: "Outbound HTTPS to Google Health API v4."
    - name: "network:oauth2.googleapis.com"
      description: "Outbound HTTPS to Google OAuth token endpoint."
    - name: "network:accounts.google.com"
      description: "Browser authorization endpoint for operator account binding."
