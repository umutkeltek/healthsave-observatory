# HealthSave bundled Mosquitto broker configuration.
#
# Profile-gated (`mosquitto`) — opt-in alongside the `home-assistant`
# profile so a single `docker compose --profile mosquitto --profile
# home-assistant up -d` brings up the broker AND the HA-MQTT bridge
# pointing at it.
#
# Authentication is added at start by deploy/mosquitto/entrypoint.sh:
# MOSQUITTO_USERNAME + MOSQUITTO_PASSWORD set (setup generates them) means
# `allow_anonymous false` with a password file; unset means anonymous, with
# a warning in `docker compose logs mqtt`. Do not set allow_anonymous here.

listener 1883

# Persist queued + retained messages across restarts so HA does not
# lose the last-published health snapshot on a `docker compose
# restart mqtt`.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Stream to docker logs in addition to a file inside the container
# (the file lets `mosquitto_sub -h ...` debugging dump history; the
# stdout target makes `docker compose logs mqtt` useful).
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type notice
log_type warning
log_type error

# Connection limits — single-user broker, modest defaults.
max_connections -1
max_inflight_messages 40
max_queued_messages 1000
