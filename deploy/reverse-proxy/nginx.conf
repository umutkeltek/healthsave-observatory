# datahub reverse proxy — durable per-IP rate limiting (SECURITY-004).
#
# Mounted at /etc/nginx/conf.d/default.conf, so the directives below run inside
# the stock image's `http {}` block. This is the *gateway* rate limit the app's
# in-process body/batch/export caps cannot provide (per-IP, survives restarts,
# applies before the request reaches the API).
#
# Two per-IP zones: a general API zone and a tighter ingest/webhook zone. State
# is keyed on $binary_remote_addr — put a real client IP here. If you front this
# with Cloudflare/another proxy, use the real-IP module so the limit keys on the
# end client, not the upstream proxy (see the commented real_ip block).

limit_req_zone  $binary_remote_addr zone=api:10m     rate=10r/s;
limit_req_zone  $binary_remote_addr zone=ingest:10m  rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;
limit_req_status 429;
limit_conn_status 429;

# If a trusted proxy (Cloudflare, an LB) sits in front, restore the real client
# IP so rate limits key on the end user. Uncomment + set your proxy's ranges:
# real_ip_header X-Forwarded-For;
# set_real_ip_from 0.0.0.0/0;   # tighten to your proxy's CIDR

upstream datahub_api {
    server api:8000;
    keepalive 16;
}

# The Next.js web frontend is a separate compose service. Path-based routing
# in the TLS server below sends non-API traffic here; the API keeps its
# dedicated /api/* prefixes. Keeps the surface invertible if we ever move
# the web tier elsewhere.
upstream datahub_web {
    server web:4173;
    keepalive 16;
}

# Grafana PHI dashboards. Routed under /grafana/ so the password-stateful
# Grafana session cookie stays scoped to a path (not the root) — fewer
# cookie collisions if other services ever share the same hostname.
upstream datahub_grafana {
    server grafana:3000;
    keepalive 8;
}

# Plain HTTP: redirect everything to HTTPS. ACME http-01 challenges (Let's
# Encrypt) and the proxied API on apps-vm get a single canonical port.
server {
    listen 80;
    server_name apps-vm.internal apps-vm apps-vm.local observatory.local;

    # Match the app's 16 MiB body cap so oversized bodies are rejected here too.
    client_max_body_size 16m;
    limit_conn conn 20;

    # ACME challenge passthrough so a real CA can later replace the self-signed
    # cert with no proxy change.
    location /.well-known/acme-challenge/ {
        proxy_pass http://datahub_api;
    }
    location = /health     { proxy_pass http://datahub_api; }
    location = /api/health { proxy_pass http://datahub_api; }
    location = /ready      { proxy_pass http://datahub_api; }

    # Everything else: 301 to https on the same host.
    location / {
        return 301 https://$host$request_uri;
    }
}

# TLS server — single canonical ingress. The self-signed cert generated by
# deploy/reverse-proxy/generate-self-signed.sh covers apps-vm.internal +
# apps-vm + 192.168.33.123. Swap fullchain.pem / privkey.pem for a Let's
# Encrypt-issued pair (or any other CA) and the nginx block below stays
# unchanged.
server {
    listen 443 ssl;
    http2 on;
    server_name apps-vm.internal apps-vm apps-vm.local observatory.local;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 16m;
    limit_conn conn 20;

    # Proxy headers (inherited by all locations below).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;   # generous: SSE narration streams + slow LLM reads

    # Liveness/readiness: never rate-limited (monitoring + orchestrator probes).
    location = /health     { proxy_pass http://datahub_api; }
    location = /api/health { proxy_pass http://datahub_api; }
    location = /ready      { proxy_pass http://datahub_api; }

    # Ingest hot path — tight per-IP limit (the live iOS device bursts, so allow
    # a burst but throttle abuse).
    location = /api/apple/batch {
        limit_req zone=ingest burst=10 nodelay;
        proxy_pass http://datahub_api;
    }

    # Internet-facing webhook (Whoop) — tight limit; HMAC is verified by the app.
    location /api/v2/sources/whoop/webhook {
        limit_req zone=ingest burst=5 nodelay;
        proxy_pass http://datahub_api;
    }

    # Everything else (reads, v2 API + web).
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://datahub_api;
    }
    # The Next.js frontend. Static assets (/_next/, /icon.svg, /favicon.ico)
    # flow through this same upstream; web:4173 already serves them with its
    # own caching headers.
    location / {
        proxy_pass http://datahub_web;
    }
}
